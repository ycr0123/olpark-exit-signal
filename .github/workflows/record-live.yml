name: record-live
# 기관 실시간 주차현황을 5분마다 받아 live 브랜치의 recent.json(최근 4시간)으로 남긴다.
# 시연 페이지는 이 파일로 처음 연 사람에게도 30분 변화를 바로 보여 준다.
# live 브랜치는 매번 커밋 하나로 덮어써 이력이 쌓이지 않는다.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: record-live
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: record
        run: |
          # live 브랜치가 있으면 이전 기록을 반드시 읽는다. 못 읽으면 실패로 멈추고 덮어쓰지 않는다.
          set +e; git ls-remote --exit-code --heads origin live >/dev/null; rc=$?; set -e
          if [ "$rc" = "0" ]; then
            git fetch -q origin live
            git show FETCH_HEAD:recent.json > prev.json
            python3 tools/record_recent.py prev.json recent.json
          elif [ "$rc" = "2" ]; then
            python3 tools/record_recent.py none recent.json --init
          else
            echo "ls-remote failed rc=$rc"; exit 1
          fi
      - name: publish
        run: |
          mkdir out && cp recent.json out/ && cd out
          git init -q -b live
          git add recent.json
          git -c user.name=record-bot -c user.email=record-bot@users.noreply.github.com commit -qm "recent"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live
